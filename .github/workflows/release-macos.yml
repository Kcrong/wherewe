name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref_name }}-${{ inputs.release_tag || 'tag' }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Kcrong/wherewe'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MACOS_BUNDLE_IDENTIFIER: com.kcrong.wherewe
      NOTARY_PROFILE: wherewe-notary
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Configure release paths
        run: |
          {
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/wherewe-release.keychain-db"
            echo "CERTIFICATE_PATH=$RUNNER_TEMP/wherewe-release.p12"
            echo "WHEREWE_NATIVE_BUILD_DIR=$RUNNER_TEMP/native-release-build"
            echo "WHEREWE_NATIVE_DIST_DIR=$RUNNER_TEMP/native-release-dist"
            echo "WHEREWE_DMG_BUILD_DIR=$RUNNER_TEMP/native-dmg-build"
            echo "WHEREWE_DMG_OUTPUT_DIR=$RUNNER_TEMP/native-dmg-dist"
            echo "WHEREWE_NATIVE_SMOKE_ROOT=$RUNNER_TEMP/native-app-smoke"
          } >> "$GITHUB_ENV"

      - name: Run complete non-secret release gate
        run: bash scripts/test-release-prerequisites.sh

      - name: Resolve and validate release metadata
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$DISPATCH_TAG"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH." >&2
            exit 1
          }
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$TAG_COMMIT" == "$(git rev-parse origin/main)" ]] || {
            echo "Release tag must point to the current origin/main commit." >&2
            exit 1
          }
          [[ "$MACOS_BUNDLE_IDENTIFIER" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]] || {
            echo "MACOS_BUNDLE_IDENTIFIER must remain a permanent reverse-DNS identifier." >&2
            exit 1
          }
          RELEASE_VERSION="${RELEASE_TAG#v}"
          /usr/bin/plutil -replace CFBundleIdentifier -string "$MACOS_BUNDLE_IDENTIFIER" macos/Resources/Info.plist
          /usr/bin/plutil -replace CFBundleShortVersionString -string "$RELEASE_VERSION" macos/Resources/Info.plist
          /usr/bin/plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" macos/Resources/Info.plist
          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "WHEREWE_NATIVE_APP_PATH=$WHEREWE_NATIVE_DIST_DIR/Wherewe.app"
            echo "WHEREWE_DMG_PATH=$WHEREWE_DMG_OUTPUT_DIR/Wherewe-$RELEASE_VERSION-arm64.dmg"
          } >> "$GITHUB_ENV"

      - name: Require release credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD; do
            [[ -n "${!name:-}" ]] || {
              echo "Required GitHub Actions secret is not configured: $name" >&2
              exit 1
            }
          done

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          /usr/bin/security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          /usr/bin/security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          /usr/bin/security list-keychains -d user -s "$KEYCHAIN_PATH"
          /usr/bin/security default-keychain -d user -s "$KEYCHAIN_PATH"
          WHEREWE_CODESIGN_IDENTITY="$(
            /usr/bin/security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | /usr/bin/awk -F'"' '/Developer ID Application:/{print $2; exit}'
          )"
          [[ -n "$WHEREWE_CODESIGN_IDENTITY" ]] || {
            echo "The imported certificate is not a valid Developer ID Application identity." >&2
            exit 1
          }
          echo "WHEREWE_CODESIGN_IDENTITY=$WHEREWE_CODESIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Store and validate notarisation credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
          /usr/bin/xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN_PATH" \
            --validate

      - name: Build and verify Developer ID app
        run: |
          bash scripts/build-macos-app.sh
          bash scripts/test-macos-app-bundle.sh
          /usr/bin/codesign -dv --verbose=4 "$WHEREWE_NATIVE_APP_PATH" 2>&1 \
            | /usr/bin/grep -q 'Authority=Developer ID Application:'
          /usr/bin/codesign -dv --verbose=4 "$WHEREWE_NATIVE_APP_PATH" 2>&1 \
            | /usr/bin/grep -q 'flags=.*runtime'

      - name: Build and mount-verify signed DMG
        run: |
          bash scripts/build-macos-dmg.sh
          bash scripts/test-macos-dmg.sh

      - name: Notarise and staple DMG
        run: |
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
          /usr/bin/xcrun notarytool submit "$WHEREWE_DMG_PATH" \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" \
            --wait \
            --timeout 45m
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
          /usr/bin/xcrun stapler staple "$WHEREWE_DMG_PATH"
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
          /usr/bin/xcrun stapler validate "$WHEREWE_DMG_PATH"
          /usr/sbin/spctl --assess --type open --context context:primary-signature --verbose=4 "$WHEREWE_DMG_PATH"
          bash scripts/test-macos-dmg.sh

      - name: Create SHA-256 checksum
        run: |
          cd "$WHEREWE_DMG_OUTPUT_DIR"
          /usr/bin/shasum -a 256 "$(basename "$WHEREWE_DMG_PATH")" \
            > "$(basename "$WHEREWE_DMG_PATH").sha256"
          /usr/bin/shasum -a 256 -c "$(basename "$WHEREWE_DMG_PATH").sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          CHECKSUM_PATH="$WHEREWE_DMG_PATH.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$WHEREWE_DMG_PATH" "$CHECKSUM_PATH" --clobber
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PRERELEASE" == "true" ]]; then
            gh release create "$RELEASE_TAG" \
              "$WHEREWE_DMG_PATH" "$CHECKSUM_PATH" \
              --verify-tag \
              --title "Wherewe $RELEASE_VERSION" \
              --generate-notes \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              "$WHEREWE_DMG_PATH" "$CHECKSUM_PATH" \
              --verify-tag \
              --title "Wherewe $RELEASE_VERSION" \
              --generate-notes
          fi

      - name: Delete temporary release keychain
        if: always()
        run: |
          /usr/bin/security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
