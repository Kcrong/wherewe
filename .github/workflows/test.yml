name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  static:
    name: Static contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check JavaScript and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for source in tests/native/*.test.js tests/public/*.test.js scripts/scan-public-content.js; do
            node --check "$source"
          done
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Scan public content without printing matched values
        run: node scripts/scan-public-content.js
      - name: Run all static contracts
        run: node --test tests/native/*.test.js tests/public/*.test.js

  macos:
    name: macOS build and tests
    needs: static
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure isolated validation paths
        run: |
          mkdir -p "$RUNNER_TEMP/native-runtime"
          {
            echo "KIROCREW_SCRATCH=$RUNNER_TEMP/native-runtime"
            echo "SWIFT_SCRATCH_PATH=$RUNNER_TEMP/native-full-build"
            echo "WHEREWE_NATIVE_BUILD_DIR=$RUNNER_TEMP/native-full-build"
            echo "WHEREWE_NATIVE_DIST_DIR=$RUNNER_TEMP/native-full-dist"
            echo "WHEREWE_NATIVE_APP_PATH=$RUNNER_TEMP/native-full-dist/Wherewe.app"
            echo "WHEREWE_NATIVE_SMOKE_ROOT=$RUNNER_TEMP/native-app-smoke"
            echo "WHEREWE_DMG_OUTPUT_DIR=$RUNNER_TEMP/native-dmg-dist"
            echo "WHEREWE_DMG_BUILD_DIR=$RUNNER_TEMP/native-dmg-build"
          } >> "$GITHUB_ENV"
      - name: Build Swift package
        run: |
          xcrun swift build \
            --package-path macos \
            --scratch-path "$SWIFT_SCRATCH_PATH" \
            --product Wherewe
      - name: Run Swift unit tests
        run: |
          xcrun swift test \
            --package-path macos \
            --scratch-path "$SWIFT_SCRATCH_PATH"
      - name: Run native service contract checks
        run: |
          xcrun swift run \
            --package-path macos \
            --scratch-path "$SWIFT_SCRATCH_PATH" \
            MeetingTranscriberCoreChecks
      - name: Build native app
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash scripts/build-macos-app.sh
      - name: Smoke-test clean launch and relaunch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash scripts/test-macos-app-bundle.sh
      - name: Build and mount-verify DMG
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          bash scripts/build-macos-dmg.sh
          bash scripts/test-macos-dmg.sh
          shopt -s nullglob
          dmg_candidates=("$WHEREWE_DMG_OUTPUT_DIR"/Wherewe-*-arm64.dmg)
          shopt -u nullglob
          [[ "${#dmg_candidates[@]}" -eq 1 ]] || {
            echo 'Expected exactly one verified test DMG.' >&2
            exit 1
          }
          source_path="${dmg_candidates[0]}"
          test_path="${source_path%.dmg}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.dmg"
          /bin/mv "$source_path" "$test_path"
      - name: Upload downloadable test DMG
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: upload-test-dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.WHEREWE_DMG_OUTPUT_DIR }}/Wherewe-*-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}.dmg
          if-no-files-found: error
          retention-days: 7
          archive: false
      - name: Publish test DMG download details
        if: ${{ github.event_name == 'workflow_dispatch' && steps.upload-test-dmg.outcome == 'success' }}
        run: |
          {
            echo '## Downloadable test DMG'
            echo
            echo '[Download the test DMG](${{ steps.upload-test-dmg.outputs.artifact-url }})'
            echo
            echo 'Artifact SHA-256: `${{ steps.upload-test-dmg.outputs.artifact-digest }}`'
            echo
            echo 'Source: `${{ github.ref_name }} @ ${{ github.sha }}`'
            echo
            echo 'GitHub sign-in is required. This is an unsigned, non-notarized DMG containing an ad-hoc-signed app.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Probe available Apple runtime assets
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          WHEREWE_NATIVE_REAL_APPLE_SPEECH: 'auto'
          WHEREWE_NATIVE_REAL_APPLE_TRANSLATION: 'auto'
        run: |
          xcrun swift test \
            --package-path macos \
            --scratch-path "$SWIFT_SCRATCH_PATH" \
            --filter NativeRuntimeIntegrationTests
